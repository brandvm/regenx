RegenX — three snippets for SiteID 6a343f4bd4c8ed2f7270a980.
Paste each marked piece into its stated location. Do not paste this entire file.

Local:   https://regen-x.webflow.io/?bv-dev=1 → http://localhost:3000/

<!-- START HEAD: Site settings → Custom code → Head code -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="theme-color" content="#000000" />
<link rel="preconnect" href="https://brandvm.github.io" crossorigin />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<script src="https://analytics.ahrefs.com/analytics.js" data-key="PtqjupbG4bujq85ZdpJCOA" async></script>
<script async type="module" src="https://cdn.jsdelivr.net/npm/@finsweet/attributes@2/attributes.js" fs-mirrorclick></script>
<style>
  html.is-loading, html.is-loading body { overflow: hidden; height: 100%; }
  html.is-loading .preloader { display: flex !important; }
  html.rgx-ready .preloader, html.rgx-load-failed .preloader { display: none !important; }
</style>
<script>
  (function () {
    if (window.BV && window.BV.site === "regenx") return;
    var RELEASE = null;
    var staging = /\.webflow\.io$/.test(location.hostname);
    var local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
    var q = new URLSearchParams(location.search);
    var flag = q.has("bv-dev") ? q.get("bv-dev") === "1" : false;
    try {
      if (staging && q.has("bv-dev")) localStorage.setItem("bv-dev", flag ? "1" : "0");
      if (staging && !q.has("bv-dev")) flag = localStorage.getItem("bv-dev") === "1";
    } catch (e) { /* URL flags also work when browser storage is blocked. */ }
    var root = document.documentElement;
    var timer;
    var C = window.BV = {
      site: "regenx",
      staging: staging,
      dev: local || (staging && flag),
      devBase: "http://localhost:3000/",
      stag: "https://brandvm.github.io/regenx/",
      prod: RELEASE ? "https://cdn.jsdelivr.net/gh/brandvm/regenx@" + RELEASE + "/dist/" : null,
      stamp: Date.now(),
      release: function (failed) {
        clearTimeout(timer);
        root.classList.remove("is-loading");
        root.classList.add(failed ? "rgx-load-failed" : "rgx-ready");
      }
    };
    root.classList.add("is-loading");
    // Independent of window.load: even a hanging external request cannot lock scrolling.
    timer = setTimeout(function () { C.release(true); }, 8000);
  })();
</script>
<!-- END HEAD -->

<!-- START EMBED: replace the global CodeSandbox CSS embed on the Designer canvas.
     Put this in the shared global-code/header component used on every page.
     Static links support Designer preview (where scripts don't run). When both
     stylesheets load in the Designer, they are additive; verify rule deletions
     on the published staging page in dev mode. Keep the icon font link here. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" />
<link id="bv-css" rel="stylesheet" href="https://brandvm.github.io/regenx/styles.css?v=1" />
<link id="bv-css-dev" rel="stylesheet" href="http://localhost:3000/styles.css" />
<script>
  (function () {
    var C = window.BV;
    if (!C) return;
    var base = document.getElementById("bv-css");
    var dev = document.getElementById("bv-css-dev");
    if (C.dev) {
      if (base) base.remove();
    } else {
      if (dev) dev.remove();
      if (base && C.staging) base.href = C.stag + "styles.css?v=" + C.stamp;
      else if (base && C.prod) base.href = C.prod + "styles.css";
      else if (base) base.remove();
    }
  })();
</script>
<!-- END EMBED -->

<!-- START FOOTER: Site settings → Custom code → Footer code.
     Replaces the Lenis CDN, inline Lenis setup, and both CodeSandbox scripts.
     Keep Webflow's native GSAP/ScrollTrigger/SplitText/CustomEase settings enabled. -->
<script>
  (function () {
    var C = window.BV;
    if (!C) {
      document.documentElement.classList.remove("is-loading");
      document.documentElement.classList.add("rgx-load-failed");
      console.error("[RegenX] Missing HEAD snippet from loader.html.");
      return;
    }
    if (C.loading) return;
    C.loading = true;
    var sources = C.dev ? [C.devBase, C.stag] : C.staging ? [C.stag] : C.prod ? [C.prod] : [];
    // One matching CSS/JS source at a time, including local → staging fallback.
    // This also supplies site CSS if a page is missing the shared Embed.
    document.querySelectorAll("#bv-css, #bv-css-dev").forEach(function (el) { el.remove(); });
    function next() {
      var base = sources.shift();
      if (!base) {
        C.release(true);
        console.error("[RegenX] No bundle loaded. Check pnpm dev / the GitHub Pages deployment. Production requires a release tag.");
        return;
      }
      var suffix = base === C.prod ? "" : "?v=" + C.stamp;
      var css = document.createElement("link");
      css.id = "bv-css";
      css.rel = "stylesheet";
      css.href = base + "styles.css" + suffix;
      var settled = false;
      var timeout = setTimeout(failCSS, 5000);
      function failCSS() {
        if (settled) return;
        settled = true;
        clearTimeout(timeout);
        css.remove();
        console.warn("[RegenX] Styles unavailable at " + base);
        next();
      }
      css.onerror = failCSS;
      css.onload = function () {
        if (settled) return;
        settled = true;
        clearTimeout(timeout);
        C.source = base;
        var s = document.createElement("script");
        s.src = base + "index.js" + suffix;
        s.onerror = function () {
          s.remove();
          css.remove();
          console.warn("[RegenX] Script unavailable at " + base);
          next();
        };
        // No script timeout race: a slow local script must not execute after a fallback.
        document.head.appendChild(s);
      };
      document.body.appendChild(css);
    }
    next();
  })();
</script>
<!-- END FOOTER -->
